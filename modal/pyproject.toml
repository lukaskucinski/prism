[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "PRISM data pipeline: ingest, H3 indexing, friction scoring"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fiona>=1.9",
  "requests>=2.31",
  "h3>=4.1",
  "psycopg[binary]>=3.2",
  "supabase>=2.0",
  "python-dotenv>=1.0",
  "tqdm>=4.65",
  "tenacity>=8.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
